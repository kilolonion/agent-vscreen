name: Device tests (emulator)
# 1.4.2: real-device style checks on Android emulators, on every push to main / v1.4 and on pull requests.
#  - agent-e2e: an agent drives the background screen through the HTTP API (launch, look, act, busy, release),
#    the user's main screen stays untouched, the app never crashes (tools/android-smoke/agent_e2e.py), on
#    Android 11 (no own display group: screen sleeps with the phone) and Android 14 (own display group).
#  - shizuku: granting Shizuku on a fresh install and after the 1.3 -> 1.4 -> candidate upgrade path survives a
#    relaunch (tools/android-smoke/shizuku.py).
#  - root-e2e (1.4.2-beta3): the same agent run through the root way in with no Shizuku installed, using a stand-in
#    root manager (tools/android-smoke/avsu.c, a Magisk-like su daemon). "shell": the service runs as uid 2000 via
#    `su 2000`; "uid0": the root manager cannot switch uids, so it runs as root. Then: the service outlives the app,
#    the next app process adopts it, and switching back to Shizuku stops it.
on:
  push:
    branches: [main, v1.4, v2.0, 'v2/**', 'beta/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - run: ./tsbridge/build.sh
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Stand-in root manager for the emulator (x86_64)
        run: |
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --target=x86_64-linux-android30 -O2 -Wall \
            -o "$AVS_BUILD_DIR/avsu" tools/android-smoke/avsu.c
      # Debug: carries the CI hook (src/debug) that hands the test its token; release APKs never do.
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :torture:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: candidate
          path: |
            ${{ env.AVS_BUILD_DIR }}/app/outputs/apk/debug/app-debug.apk
            ${{ env.AVS_BUILD_DIR }}/app/outputs/apk/release/app-release.apk
            ${{ env.AVS_BUILD_DIR }}/torture/outputs/apk/debug/torture-debug.apk
            ${{ env.AVS_BUILD_DIR }}/avsu
          retention-days: 3
  agent-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Our native code is arm64 only, so the x86_64 emulator must run it through the arm64 translator. API 30/31
        # translators abort on an FPCR write (fp16 OCR) and the API 33 image has no translator at all, so only 34+
        # can run the app here. Real phones are not affected.
        api: [34, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch Shizuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/agent_e2e.py test-apks/app-debug.apk 2>&1 | tee e2e.log; grep -q '^SUMMARY all passed' e2e.log || { adb logcat -d > logcat.txt; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.api }}-logs
          path: |
            e2e.log
            logcat.txt
          retention-days: 7
  root-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [root, root-uid0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - run: |
          find test-apks -type f -exec mv {} test-apks/ \; 2>/dev/null || true
          ls -la test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/agent_e2e.py test-apks/app-debug.apk --${{ matrix.mode }} 2>&1 | tee e2e.log; grep -q '^SUMMARY all passed' e2e.log || { adb logcat -d > logcat.txt; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: root-${{ matrix.mode }}-logs
          path: |
            e2e.log
            logcat.txt
          retention-days: 7
  shizuku:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        path: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch public releases
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PATH: ${{ matrix.path }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
          if [[ "$TEST_PATH" == upgrade ]]; then
            for version in 1.3.0 1.4.0; do
              gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output "test-apks/$version.apk"
            done
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/shizuku.py ${{ matrix.path }}
  eval:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch Shizuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: mkdir -p eval-out && { python3 tools/eval/run.py --apk test-apks/torture-debug.apk --out eval-out --repeat-check > eval-out/eval.log 2>&1 || { rc=$?; cat eval-out/eval.log; adb logcat -d > eval-out/logcat.txt; exit "$rc"; }; cat eval-out/eval.log; }
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-results
          path: eval-out/*
          if-no-files-found: warn
          retention-days: 7
  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            profile: pixel_6
            flag: ""
          - api: 30
            profile: pixel_2
            flag: "--api30"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch Shizuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/gate.py test-apks/app-debug.apk ${{ matrix.flag }} 2>&1 | tee gate.log; grep -q '^SUMMARY all passed' gate.log || { adb logcat -d > logcat.txt; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gate-${{ matrix.api }}-logs
          path: |
            gate.log
            logcat.txt
          retention-days: 7
