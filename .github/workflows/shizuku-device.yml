name: Android Shizuku verification
on:
  push:
    branches: [ci/verify-headscale-shizuku-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-shizuku-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, '[headscale]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - run: ./tsbridge/build.sh
      - run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: candidate
          path: ${{ env.AVS_BUILD_DIR }}/app/outputs/apk/release/app-release.apk
          retention-days: 2
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        path: [fresh, upgrade, published-beta]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch public releases
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PATH: ${{ matrix.path }}
        run: |
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
          if [[ "$TEST_PATH" == upgrade ]]; then
            for version in 1.3.0 1.4.0; do
              gh release download "v$version" --pattern '*.apk' --output "test-apks/$version.apk"
            done
          elif [[ "$TEST_PATH" == published-beta ]]; then
            gh release download v1.4.1-beta1 --pattern '*.apk' --output test-apks/baseline.apk
          fi
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/shizuku.py ${{ matrix.path }}
