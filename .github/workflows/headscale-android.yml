name: Android Headscale and FlClash verification
on:
  push:
    branches: [ci/verify-headscale-shizuku-20261118]
    paths: ['tools/android-smoke/headscale*', '.github/workflows/headscale-android.yml']
permissions:
  actions: read
  contents: read
jobs:
  emulator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the app with a native Android x86_64 node for this emulator
        run: |
          set -eu
          export CC=$(find "$ANDROID_HOME/ndk" -path '*/bin/x86_64-linux-android30-clang' | sort -V | tail -1)
          test -x "$CC"
          tags=$(sed -n 's/^TAGS="\(.*\)"$/\1/p' tsbridge/build.sh)
          mkdir -p app/src/main/jniLibs/x86_64
          (cd tsbridge && GOOS=android GOARCH=amd64 CGO_ENABLED=1 go build -tags "netgo,osusergo,$tags" -trimpath -ldflags '-s -w -buildid=' -o ../app/src/main/jniLibs/x86_64/libtsbridge.so .)
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
          AVS_BUILD_DIR="$GITHUB_WORKSPACE/.avs-build" ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: emulator-only
          path: .avs-build/app/outputs/apk/release/app-release.apk
          include-hidden-files: true
          retention-days: 2
  android:
    needs: emulator-apk
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        vpn: [off, flclash]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: emulator-only
          path: test-apks
      - name: Fetch public fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-apks hs
          gh release download v0.27.1 -R juanfont/headscale -p headscale_0.27.1_linux_amd64 -p checksums.txt -D hs
          (cd hs && grep '  headscale_0.27.1_linux_amd64$' checksums.txt | sha256sum --check -)
          chmod +x hs/headscale_0.27.1_linux_amd64
          curl -fsSL https://raw.githubusercontent.com/juanfont/headscale/v0.27.1/config-example.yaml -o hs/example.yaml
          if [[ "${{ matrix.vpn }}" == flclash ]]; then
            gh release download v0.9.3 -R chen08209/FlClash -p '*android-x86_64.apk' -O test-apks/flclash.apk
          fi
      - name: Start private DNS and Headscale
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq-base
          sudo dnsmasq --no-resolv --no-hosts --bind-interfaces --listen-address=127.0.0.1 --port=53 --address=/headscale.smoke.test/10.0.2.2 --pid-file="$RUNNER_TEMP/smoke-dns.pid"
          python3 tools/android-smoke/headscale_android.py fixtures
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -dns-server 127.0.0.1
          script: python3 tools/android-smoke/headscale_android.py ${{ matrix.vpn }}
