# CI for Agent-VScreen (free on public repositories).
# Branches and PRs: check and build only; the release APK is signed with the debug key (no keystore.properties).
# A tag v* (for example v1.4.1): the release APK is signed with the key from the repository's encrypted secrets
# (AVS_KEYSTORE_BASE64, AVS_KEYSTORE_PASSWORD, AVS_KEY_ALIAS, AVS_KEY_PASSWORD), then the APK and the Operit ToolPkg
# are uploaded to a GitHub Release for that tag. Notes come from docs/release-notes/<tag>.md when it exists.
name: CI

on:
  push:
    branches: [main, "v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # build.sh / build.gradle.kts put outputs under $AVS_BUILD_DIR (ignored by .gitignore).
  AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build

jobs:
  android:
    name: Generated files, unit tests, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build dir
        run: |
          mkdir -p "$AVS_BUILD_DIR/tmp" "$AVS_BUILD_DIR/logs"

      - name: Built-in Tailscale node (tsbridge)
        run: ./tsbridge/build.sh

      - name: Cloudflare tunnel client (cloudflared)
        run: CLOUDFLARED_SRC="$RUNNER_TEMP/cloudflared-src" ./cloudflared/build.sh

      - name: tsbridge unit tests
        run: (cd tsbridge && go test -v ./...)

      - name: Verify android/arm64 tsbridge includes LocalAPI cert route and feature/acme
        run: |
          (cd tsbridge && GOOS=android GOARCH=arm64 go list -f '{{.GoFiles}}' . | grep -q 'localapi_cert_android.go')
          (cd tsbridge && GOOS=android GOARCH=arm64 go list -deps . | grep -qx 'tailscale.com/feature/acme')

      - name: OCR assets read on the app's onnxruntime
        run: |
          ORT=$(grep -o 'onnxruntime-android:[0-9.]*' app/build.gradle.kts | cut -d: -f2)
          pip install --quiet "onnxruntime==$ORT" numpy pillow scipy
          python tools/ocr-bench/check_assets.py app/src/main/assets/vscreen-ocr "$ORT"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Robolectric downloads its android-all jars at test time; a failed download fails every Robolectric class
      # (MavenArtifactFetcher AssertionError). Keep them between runs.
      - name: Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # Same as `./build.sh regen`: tests rewrite the files generated from the tables, then the tree must be unchanged.
      - name: Unit tests (with regen)
        env:
          AVS_REGEN: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Generated files are up to date
        run: |
          # Untracked too: a generated file deleted from git and rewritten by its test must also fail here.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files are stale. Run ./build.sh regen and commit the result."
            exit 1
          fi

      # Only on a tag push. Secrets are not given to pull requests from forks, and this runs after the tests.
      - name: Release signing key
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.AVS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AVS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AVS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AVS_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Signing secrets missing (AVS_KEYSTORE_BASE64, AVS_KEYSTORE_PASSWORD, AVS_KEY_ALIAS, AVS_KEY_PASSWORD)"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | base64 -d > keystore/agent-vscreen.jks
          printf 'storeFile=keystore/agent-vscreen.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Native code per APK (debug arm64 + x86_64, release arm64 only)
        run: tools/android-smoke/check_abis.sh "$AVS_BUILD_DIR/app/outputs/apk/debug/app-debug.apk" "$AVS_BUILD_DIR/app/outputs/apk/release/app-release.apk"

      - name: Release APK contains no debug test hooks
        run: tools/android-smoke/check_release_hooks.sh "$AVS_BUILD_DIR/app/outputs/apk/debug/app-debug.apk" "$AVS_BUILD_DIR/app/outputs/apk/release/app-release.apk"

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: .avs-build/app/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: .avs-build/app/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

  operit:
    name: Operit ToolPkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          find integrations/operit/dist -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool integrations/operit/manifest.json > /dev/null
      - name: Pack
        run: ./integrations/operit/build.sh "$RUNNER_TEMP/agent-vscreen.toolpkg"
      - uses: actions/upload-artifact@v5
        with:
          name: toolpkg
          path: ${{ runner.temp }}/agent-vscreen.toolpkg
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks CLI (MIT) directly, not the gitleaks GitHub Action, so no license key is ever needed.
      - name: Scan full history
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  release:
    name: GitHub Release
    # Tag pushes only: a manual run on a tag ref must not sign or publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, operit, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # SHA-256 of the Agent-VScreen release certificate (CN=Agent-VScreen), read from the published v1.4.0 APK.
      # An APK signed by any other key cannot update existing installs, so the release stops.
      RELEASE_CERT_SHA256: 56b14824549e698017eba907cbc3347ee3a4ba30907efbd6068ea51ff4495756
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dl
      - name: Name assets and check the signature
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          mkdir out
          cp dl/apks/release/*.apk "out/agent-vscreen-${VER}.apk"
          cp dl/toolpkg/agent-vscreen.toolpkg "out/agent-vscreen-${VER}.toolpkg"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          CERT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "out/agent-vscreen-${VER}.apk")
          echo "$CERT" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          GOT=$(echo "$CERT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$GOT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK signer $GOT is not the release certificate $RELEASE_CERT_SHA256"; exit 1
          fi
          (cd out && sha256sum -- *.apk *.toolpkg > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            printf '**下载**：agent-vscreen-%s.apk（App）· agent-vscreen-%s.toolpkg（Operit 插件）\n' "$VER" "$VER" > "$NOTES"
          fi
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "$TAG" --notes-file "$NOTES" --verify-tag $PRE
          fi
