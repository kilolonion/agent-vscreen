# CI for Agent-VScreen (free on public repositories).
# Branches and PRs: check, unit tests (with regen & AOCI coverage gate), and debug + unsigned release APKs (zero signing secrets).
# A tag v* (for example v2.0.1): `android`, `operit`, `secrets`, and `release-device` (full emulator matrix) must all pass,
# then the isolated `release` job (under `environment: release` for secret scoping only, no manual approval; no checkout/build tools) verifies the APK is unsigned,
# aligns (16 KB) & signs it with AVS_KEYSTORE_* secrets, verifies the certificate SHA-256, and creates the GitHub Release.
# Notes come from docs/release-notes/<tag>.md (required and non-empty).
name: CI

on:
  push:
    branches: [main, "v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # build.sh / build.gradle.kts put outputs under $AVS_BUILD_DIR (ignored by .gitignore).
  AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build

jobs:
  android:
    name: Generated files, unit tests, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build dir
        run: |
          mkdir -p "$AVS_BUILD_DIR/tmp" "$AVS_BUILD_DIR/logs"

      - name: Built-in Tailscale node (tsbridge)
        run: ./tsbridge/build.sh

      - name: Cloudflare tunnel client (cloudflared)
        run: CLOUDFLARED_SRC="$RUNNER_TEMP/cloudflared-src" ./cloudflared/build.sh

      - name: tsbridge unit tests
        run: (cd tsbridge && go test -v ./...)

      - name: Verify android/arm64 tsbridge includes LocalAPI cert route and feature/acme
        run: |
          (cd tsbridge && GOOS=android GOARCH=arm64 go list -f '{{.GoFiles}}' . | grep -q 'localapi_cert_android.go')
          (cd tsbridge && GOOS=android GOARCH=arm64 go list -deps . | grep -qx 'tailscale.com/feature/acme')

      - name: OCR assets read on the app's onnxruntime
        run: |
          ORT=$(grep -o 'onnxruntime-android:[0-9.]*' app/build.gradle.kts | cut -d: -f2)
          grep -q "^onnxruntime==${ORT} " tools/ocr-bench/requirements-ci.txt || {
            echo "::error::tools/ocr-bench/requirements-ci.txt onnxruntime version does not match app/build.gradle.kts ($ORT)"
            exit 1
          }
          pip install --quiet --require-hashes --only-binary=:all: -r tools/ocr-bench/requirements-ci.txt
          python tools/ocr-bench/check_assets.py app/src/main/assets/vscreen-ocr "$ORT"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Robolectric downloads its android-all jars at test time; a failed download fails every Robolectric class
      # (MavenArtifactFetcher AssertionError). Keep them between runs.
      - name: Robolectric jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # Same as `./build.sh regen`: tests rewrite the files generated from the tables, then the tree must be unchanged.
      - name: Unit tests (with regen)
        env:
          AVS_REGEN: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Generated files are up to date
        run: |
          # Untracked too: a generated file deleted from git and rewritten by its test must also fail here.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files are stale. Run ./build.sh regen and commit the result."
            exit 1
          fi

      - name: AOCI index covers all main Kotlin sources
        run: python3 tools/ci/check_aoci_coverage.py

      - name: Text table complete in every language
        run: python3 tools/i18n/strings.py --check

      - name: Eval runner & compare unit tests
        run: python3 -m unittest discover -s tools/eval -p "test_*.py" -v

      # Release signing NEVER happens in the build job: CI always produces an unsigned release APK signed only
      # in the isolated `release` job (environment: release) that has no checkout, build tools, or untrusted deps.
      - name: Debug and unsigned release APKs
        run: ./gradlew --no-daemon -PavsUnsignedRelease=true :app:assembleDebug :app:assembleRelease

      - name: Native code per APK (debug arm64 + x86_64, release arm64 only)
        run: tools/android-smoke/check_abis.sh "$AVS_BUILD_DIR/app/outputs/apk/debug/app-debug.apk" "$AVS_BUILD_DIR/app/outputs/apk/release/app-release-unsigned.apk"

      - name: Release APK contains no debug test hooks
        run: tools/android-smoke/check_release_hooks.sh "$AVS_BUILD_DIR/app/outputs/apk/debug/app-debug.apk" "$AVS_BUILD_DIR/app/outputs/apk/release/app-release-unsigned.apk"

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: .avs-build/app/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apks
          path: .avs-build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Unsigned release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-release-apk
          path: .avs-build/app/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  operit:
    name: Operit ToolPkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          find integrations/operit/dist -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool integrations/operit/manifest.json > /dev/null
      - name: Pack
        run: ./integrations/operit/build.sh "$RUNNER_TEMP/agent-vscreen.toolpkg"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: toolpkg
          path: ${{ runner.temp }}/agent-vscreen.toolpkg
          retention-days: 7
      - name: Stage tagged release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$NOTES" || { echo '::error::Release notes are missing or empty'; exit 1; }
          cp -- "$NOTES" "$RUNNER_TEMP/release-notes.md"
      - name: Upload tagged release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # The gitleaks CLI (MIT) directly, not the gitleaks GitHub Action, so no license key is ever needed.
      - name: Scan full history
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          ARCHIVE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  release-device:
    name: Release emulator matrix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/device.yml

  release:
    name: Sign and publish
    # Tag pushes only: a manual run on a tag ref must not sign or publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, operit, secrets, release-device]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      # SHA-256 of the Agent-VScreen release certificate (CN=Agent-VScreen), read from the published v1.4.0 APK.
      # An APK signed by any other key cannot update existing installs, so the release stops.
      RELEASE_CERT_SHA256: 56b14824549e698017eba907cbc3347ee3a4ba30907efbd6068ea51ff4495756
    steps:
      # No checkout, project scripts, dependency installs or builds in this job.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-release-apk
          path: dl/apk
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: toolpkg
          path: dl/toolpkg
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: dl/notes
      - name: Align, sign and verify the release APK
        env:
          KS_B64: ${{ secrets.AVS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AVS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AVS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AVS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          : "${KS_B64:?Missing release keystore}" "${KS_PASS:?Missing release store password}" \
            "${KEY_ALIAS:?Missing release key alias}" "${KEY_PASS:?Missing release key password}"
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$SDK/apksigner" ] || [ ! -x "$SDK/zipalign" ]; then
            SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          fi
          test -x "$SDK/apksigner" && test -x "$SDK/zipalign" || exit 1
          INPUT=dl/apk/app-release-unsigned.apk
          test -s "$INPUT"
          if "$SDK/apksigner" verify "$INPUT" >/dev/null 2>&1; then
            echo '::error::Expected an unsigned input APK'; exit 1
          fi
          umask 077
          SIGN_DIR=$(mktemp -d "$RUNNER_TEMP/avs-signing.XXXXXXXX")
          trap 'rm -rf -- "$SIGN_DIR"' EXIT
          printf '%s' "$KS_B64" | base64 --decode > "$SIGN_DIR/release.jks"
          unset KS_B64
          VER="${GITHUB_REF_NAME#v}"
          mkdir out
          APK="out/agent-vscreen-${VER}.apk"
          "$SDK/zipalign" -P 16 -f 4 "$INPUT" "$SIGN_DIR/aligned.apk"
          "$SDK/apksigner" sign --ks "$SIGN_DIR/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$APK" "$SIGN_DIR/aligned.apk"
          unset KS_PASS KEY_PASS KEY_ALIAS
          "$SDK/zipalign" -c -P 16 4 "$APK"
          CERT=$("$SDK/apksigner" verify --print-certs "$APK")
          GOT=$(printf '%s\n' "$CERT" | awk '/^Signer.* certificate SHA-256 digest: [0-9a-fA-F]{64}$/ {print tolower($NF)}' | sort -u)
          if [[ "$GOT" != "$RELEASE_CERT_SHA256" ]]; then
            echo '::error::APK certificate does not match the expected release signer'; exit 1
          fi
      - name: Name assets and write checksums
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp -- dl/toolpkg/agent-vscreen.toolpkg "out/agent-vscreen-${VER}.toolpkg"
          (cd out && sha256sum -- *.apk *.toolpkg > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          test -s dl/notes/release-notes.md
          opts=()
          case "$TAG" in *-*) opts+=(--prerelease);; esac
          # Never replace the assets of an already published release.
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file dl/notes/release-notes.md --verify-tag "${opts[@]}"
